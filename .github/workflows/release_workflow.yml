name: Generate new Release
run-name: Generating new Release
on:
    workflow_dispatch:
    schedule:
        - cron: '0 0 1 * *'
jobs:
  Generate-new-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
        - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
        - name: check out repository code
          uses: actions/checkout@v4
          with:
            ssh-key: ${{ secrets.DEPLOY_KEY }}
            ref: main
            fetch-depth: 0
        - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
        - name: List files in the repository
          run: |
           ls ${{ github.workspace }}
        - name: setup python
          uses: actions/setup-python@v4
          with:
            python-version: '3.10'
        - name: install dependencies
          run: |
              pip install --upgrade pip
              pip install pandas openpyxl
        - name: execute py script 
          run: python other/scripts/output_file_generator.py ${{github.workspace}}
        - name: generate release notes
          shell: bash
          run: |
            # Calculate previous month without relying on GNU date -d (not available on Windows Git Bash)
            YEAR=$(date +%Y)
            MONTH_NUM=$((10#$(date +%m)))

            if [ $MONTH_NUM -eq 1 ]; then
                PREV_MONTH_NUM=12
                PREV_YEAR=$((YEAR - 1))
            else
                PREV_MONTH_NUM=$((MONTH_NUM - 1))
                PREV_YEAR=$YEAR
            fi

            PREV_MONTH=$(printf "%02d" $PREV_MONTH_NUM)
            START_DATE="${PREV_YEAR}-${PREV_MONTH}-01"

            # Last day of previous month (needed for git --until)
            case $PREV_MONTH_NUM in
                1|3|5|7|8|10|12) LAST_DAY=31 ;;
                4|6|9|11)         LAST_DAY=30 ;;
                2)
                    if [ $(( PREV_YEAR % 4 )) -eq 0 ] && \
                       { [ $(( PREV_YEAR % 100 )) -ne 0 ] || [ $(( PREV_YEAR % 400 )) -eq 0 ]; }; then
                        LAST_DAY=29
                    else
                        LAST_DAY=28
                    fi ;;
            esac
            END_DATE="${PREV_YEAR}-${PREV_MONTH}-${LAST_DAY}"

            # Build a human-readable month label without date -d
            MONTH_NAMES="January February March April May June July August September October November December"
            MONTH_NAME=$(echo "$MONTH_NAMES" | cut -d' ' -f$PREV_MONTH_NUM)
            MONTH_LABEL="${MONTH_NAME} ${PREV_YEAR}:"

            echo "# Commits in $MONTH_LABEL" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md

            git log \
            --since="$START_DATE" \
            --until="$END_DATE 23:59:59" \
            --date=format:'%a %b %e' \
            --pretty=format:'- %ad — %s (%an)' \
            >> RELEASE_NOTES.md

        - name: determine tag name
          id: vars
          shell: bash
          run: |
            TAG="monthly-$(date +'%Y-%m')"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_name=Automated Release $TAG" >> $GITHUB_OUTPUT
        - name: create Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.vars.outputs.tag }}
            name: ${{ steps.vars.outputs.release_name }}
            generate_release_notes: false
            body_path: RELEASE_NOTES.md
            fail_on_unmatched_files: true            
            files: |
              output.xlsx
